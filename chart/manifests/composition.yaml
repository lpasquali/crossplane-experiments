apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xappenvironments.platform.spindox.it
spec:
  compositeTypeRef:
    apiVersion: platform.spindox.it/v1alpha1
    kind: XAppEnvironment
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        {{- /*
          Keycloak's own http.relativePath is set to this same subpath
          whenever the demo reverse proxy is enabled (see the Keycloak
          Release below), so EVERY Keycloak endpoint -- including the
          ones called server-to-server over the internal Service
          hostname, like the provider-keycloak admin API and the OIDC
          plugin's userinfo/token calls -- must include it too, not just
          the externally-reachable browser-facing URLs. See
          https://www.keycloak.org/server/reverseproxy for why a
          reverse-proxied subpath must match http-relative-path exactly
          and apply uniformly to all callers, internal or not.
        */}}
        {{- $kcPath := ternary "/keycloak" "" .Values.reverseProxy.enabled }}
        resources:

          # =================================================================
          # KEYCLOAK: PostgreSQL backend (CloudNativePG, unchanged - already
          # non-Bitnami)
          # =================================================================

          # -------------------------------------------------------------
          # 1. Keycloak's PostgreSQL app-user credentials. Sourced from
          #    Vault (single source of truth) via a SecretV2 write +
          #    ExternalSecret read-back; see _helpers.tpl.
          # -------------------------------------------------------------
{{ include "crossplane-experiments.vaultBackedSecret" (dict
            "id" "keycloak-db"
            "secretName" "keycloak-db-credentials"
            "secretNamespace" "default"
            "vaultPath" "keycloak/db-credentials"
            "extraLabels" (dict "cnpg.io/reload" "true")
          ) | nindent 10 }}

          # -------------------------------------------------------------
          # 2. CloudNativePG Postgres Cluster dedicated to Keycloak
          # -------------------------------------------------------------
          - name: keycloak-postgres-cluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha1
              kind: Object
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: postgresql.cnpg.io/v1
                    kind: Cluster
                    metadata:
                      name: keycloak-postgres
                      namespace: default
                    spec:
                      instances: 1
                      storage:
                        size: 2Gi
                      # CNPG defaults to no resource requests/limits;
                      # cap the postgres container for a small VM.
                      resources:
                        requests:
                          cpu: 50m
                          memory: 128Mi
                        limits:
                          cpu: 300m
                          memory: 256Mi
                      bootstrap:
                        initdb:
                          database: keycloak
                          owner: keycloak
                          secret:
                            name: keycloak-db-credentials

          # -------------------------------------------------------------
          # 2b. Continuously reconciled Postgres role for the same
          #     "keycloak" user `bootstrap.initdb` above creates once.
          #     Unlike bootstrap.initdb (which only runs at cluster
          #     creation), CNPG's DatabaseRole watches passwordSecret and
          #     runs ALTER ROLE whenever keycloak-db-credentials changes
          #     -- e.g. after editing keycloak/db-credentials in Vault --
          #     so the real Postgres password actually stays in sync
          #     with Vault, not just the Kubernetes Secret. The
          #     "cnpg.io/reload: true" label on that Secret (set via
          #     vaultBackedSecret's extraLabels above) is required for
          #     CNPG to react immediately -- without it, the operator
          #     only notices the change on its next unrelated reconcile.
          # -------------------------------------------------------------
          - name: keycloak-postgres-role
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha1
              kind: Object
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: postgresql.cnpg.io/v1
                    kind: DatabaseRole
                    metadata:
                      name: keycloak-postgres-role
                      namespace: default
                    spec:
                      cluster:
                        name: keycloak-postgres
                      name: keycloak
                      login: true
                      passwordSecret:
                        name: keycloak-db-credentials

          # =================================================================
          # KEYCLOAK: Helm release (codecentric/keycloakx chart - official
          # quay.io/keycloak/keycloak image, NOT Bitnami) + admin credentials
          # =================================================================

          # -------------------------------------------------------------
          # 3. Keycloak admin console password. Sourced from Vault; see
          #    _helpers.tpl.
          # -------------------------------------------------------------
{{ include "crossplane-experiments.vaultBackedSecret" (dict
            "id" "keycloak-admin"
            "secretName" "keycloak-admin-secret"
            "secretNamespace" "default"
            "vaultPath" "keycloak/admin-secret"
          ) | nindent 10 }}

          # -------------------------------------------------------------
          # 4. provider-keycloak admin credentials secret. This is what the
          #    Keycloak ProviderConfig (02-provider-configs.yaml) reads, so
          #    the Realm/User/Client resources below can reach the Keycloak
          #    instance this same pipeline deploys. Service name
          #    "keycloak-http" is the keycloakx chart's fixed naming
          #    convention (fullname + "-http").
          #
          #    Built directly by a SECOND ExternalSecret reading the same
          #    Vault path as #3 above (rather than a Composition patch
          #    pulling from the composite's spec): the admin password has
          #    no claim-spec field at all -- Vault is its only source of
          #    truth -- so there's nothing for a FromCompositeFieldPath/
          #    CombineFromComposite patch to read here. ESO's own
          #    target.template does the string-building instead, using
          #    its "{{ .adminPassword }}" templating (escaped below so
          #    Helm's `tpl` leaves it alone for ESO to evaluate later).
          # -------------------------------------------------------------
          - name: keycloak-provider-creds-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha1
              kind: Object
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      name: keycloak-provider-creds-sync
                      namespace: {{ .Release.Namespace }}
                    spec:
                      refreshInterval: 1m
                      secretStoreRef:
                        name: vault-backend
                        kind: ClusterSecretStore
                      target:
                        name: keycloak-admin-creds
                        creationPolicy: Owner
                        template:
                          data:
                            credentials: |
                              {"url":"http://keycloak-http.default.svc.cluster.local{{ $kcPath }}","client_id":"admin-cli","username":"admin","password":"{{ "{{ .adminPassword }}" }}"}
                      data:
                        - secretKey: adminPassword
                          remoteRef:
                            key: keycloak/admin-secret
                            property: admin-password

          # -------------------------------------------------------------
          # 5. Keycloak (Helm Release via codecentric/keycloakx), backed by
          #    its own CloudNativePG Postgres Cluster. Image tag is pinned
          #    (not "latest") for reproducibility.
          # -------------------------------------------------------------
          - name: helm-keycloak
            base:
              apiVersion: helm.crossplane.io/v1beta1
              kind: Release
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  chart:
                    name: keycloakx
                    repository: {{ .Values.charts.keycloakx.repository }}
                    version: {{ .Values.charts.keycloakx.version | quote }}
                  namespace: default
                  values:
                    fullnameOverride: keycloak
                    replicas: 1
                    args:
                      - "start"
                    image:
                      repository: quay.io/keycloak/keycloak
                      tag: "26.7.4"
                    # Chart default is no resource requests/limits, so the
                    # JVM (-XX:MaxRAMPercentage=70, baked into the image's
                    # entrypoint) sizes its heap off the *node's* total
                    # memory instead of a sane container budget. Setting
                    # an explicit memory limit here is what actually
                    # bounds the JVM's heap/CPU footprint on a small VM.
                    resources:
                      requests:
                        cpu: 150m
                        memory: 384Mi
                      limits:
                        cpu: 750m
                        memory: 768Mi
                    http:
                      relativePath: {{ $kcPath | default "/" | quote }}
                    proxy:
                      enabled: false
                    database:
                      vendor: postgres
                      hostname: keycloak-postgres-rw.default.svc.cluster.local
                      port: 5432
                      database: keycloak
                      username: keycloak
                      existingSecret: keycloak-db-credentials
                      existingSecretKey: password
                    extraEnv: |
                      - name: KC_BOOTSTRAP_ADMIN_USERNAME
                        value: admin
                      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: keycloak-admin-secret
                            key: admin-password
                      - name: KC_HOSTNAME_STRICT
                        value: "false"
                      {{- if .Values.reverseProxy.enabled }}
                      # Pin every browser-facing URL Keycloak generates
                      # (login form action, redirects, issuer, etc.) to
                      # the reverse-proxy's externally-reachable
                      # /keycloak path. http.relativePath above is ALSO
                      # set to /keycloak, so every request -- including
                      # server-to-server calls over the internal Service
                      # hostname (token/userinfo, the provider-keycloak
                      # admin API) -- must include that same /keycloak
                      # prefix; see the $kcPath uses throughout this file.
                      - name: KC_HOSTNAME
                        value: "https://{{ .Values.reverseProxy.hostname }}:{{ .Values.reverseProxy.port }}/keycloak"
                      - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
                        value: "true"
                      {{- end }}

          # =================================================================
          # KEYCLOAK: Realm/User/Client (realm is the ONLY one WordPress may
          # authenticate against) - provider-keycloak, unchanged
          # =================================================================

          # -------------------------------------------------------------
          # 6. Keycloak Realm (default name: "setup")
          # -------------------------------------------------------------
          - name: keycloak-realm
            base:
              apiVersion: realm.keycloak.crossplane.io/v1alpha1
              kind: Realm
              metadata:
                name: setup-realm
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  realm: "setup"
                  enabled: true
                  displayName: "Setup Realm"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.realmName
                toFieldPath: spec.forProvider.realm
              - type: FromCompositeFieldPath
                fromFieldPath: spec.realmName
                toFieldPath: spec.forProvider.displayName

          # -------------------------------------------------------------
          # 7. Demo Keycloak user, created inside the "setup" realm only.
          #    Password sourced from Vault; see _helpers.tpl.
          # -------------------------------------------------------------
{{ include "crossplane-experiments.vaultBackedSecret" (dict
            "id" "keycloak-demo-user-pw"
            "secretName" "keycloak-demo-user-password"
            "secretNamespace" "default"
            "vaultPath" "keycloak/demo-user-password"
          ) | nindent 10 }}

          - name: keycloak-demo-user
            base:
              apiVersion: user.keycloak.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: demo-user
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  realmId: "setup"
                  username: "demo-user"
                  enabled: true
                  email: "demo-user@setup.local"
                  firstName: "Demo"
                  lastName: "User"
                  emailVerified: true
                  initialPassword:
                    - valueSecretRef:
                        namespace: default
                        name: keycloak-demo-user-password
                        key: password
                      temporary: false
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.realmName
                toFieldPath: spec.forProvider.realmId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.demoUserName
                toFieldPath: spec.forProvider.username
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.demoUserName
                    - fromFieldPath: spec.realmName
                  strategy: string
                  string:
                    fmt: "%s@%s.local"
                toFieldPath: spec.forProvider.email

          # -------------------------------------------------------------
          # 7a. Keycloak's Admin REST API never returns a user's current
          #     password, so provider-keycloak's User.initialPassword is
          #     (by design, hence the name) a create-only field: it is
          #     never re-applied after the user first exists, so rotating
          #     keycloak/demo-user-password in Vault alone does NOT change
          #     the live Keycloak password (verified live).
          #
          #     This CronJob is the composition-native fix: instead of
          #     diffing (impossible here), it unconditionally re-PUTs the
          #     desired password to Keycloak's reset-password endpoint on
          #     every run. Repeating the same write every tick *is*
          #     Crossplane's reconcile-to-desired-state idempotency,
          #     expressed via Keycloak's write-only API instead of a
          #     diffable CRD field. Safe/idempotent to run as often as
          #     desired; every run is a no-op in effect once the live
          #     password already matches Vault's current value.
          # -------------------------------------------------------------
          - name: keycloak-demo-user-password-sync
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha1
              kind: Object
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: batch/v1
                    kind: CronJob
                    metadata:
                      name: keycloak-demo-user-password-sync
                      namespace: default
                    spec:
                      schedule: "*/1 * * * *"
                      concurrencyPolicy: Forbid
                      successfulJobsHistoryLimit: 1
                      failedJobsHistoryLimit: 3
                      jobTemplate:
                        spec:
                          backoffLimit: 2
                          activeDeadlineSeconds: 60
                          template:
                            spec:
                              restartPolicy: Never
                              containers:
                                - name: reset-password
                                  image: curlimages/curl:8.10.1
                                  env:
                                    - name: REALM
                                      value: "setup"
                                    - name: USERNAME
                                      value: "demo-user"
                                    - name: KC_URL
                                      value: "http://keycloak-http.default.svc.cluster.local{{ $kcPath }}"
                                    - name: ADMIN_PASSWORD
                                      valueFrom:
                                        secretKeyRef:
                                          name: keycloak-admin-secret
                                          key: admin-password
                                    - name: DEMO_PASSWORD
                                      valueFrom:
                                        secretKeyRef:
                                          name: keycloak-demo-user-password
                                          key: password
                                  command:
                                    - sh
                                    - -c
                                    - |
                                      set -e
                                      TOKEN=$(curl -sf -X POST "$KC_URL/realms/master/protocol/openid-connect/token" \
                                        -d grant_type=password -d client_id=admin-cli \
                                        -d username=admin -d "password=$ADMIN_PASSWORD" \
                                        | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                                      if [ -z "$TOKEN" ]; then
                                        echo "Could not obtain admin token (Keycloak not ready yet?); will retry next run."
                                        exit 1
                                      fi
                                      USER_ID=$(curl -sf -H "Authorization: Bearer $TOKEN" \
                                        "$KC_URL/admin/realms/$REALM/users?username=$USERNAME" \
                                        | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)
                                      if [ -z "$USER_ID" ]; then
                                        echo "User $USERNAME not found yet in realm $REALM; will retry next run."
                                        exit 1
                                      fi
                                      curl -sf -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                                        -d "{\"type\":\"password\",\"value\":\"$DEMO_PASSWORD\",\"temporary\":false}" \
                                        "$KC_URL/admin/realms/$REALM/users/$USER_ID/reset-password"
                                      echo "demo-user password reconciled to current Vault value."
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.realmName
                toFieldPath: spec.forProvider.manifest.spec.jobTemplate.spec.template.spec.containers[0].env[0].value
              - type: FromCompositeFieldPath
                fromFieldPath: spec.demoUserName
                toFieldPath: spec.forProvider.manifest.spec.jobTemplate.spec.template.spec.containers[0].env[1].value

          # -------------------------------------------------------------
          # 7b. Import Keycloak's built-in "realm-management" client (auto
          #     -created per realm, not something we create ourselves) so
          #     we can reference its "realm-admin" composite role below.
          # -------------------------------------------------------------
          - name: keycloak-realm-management-client
            base:
              apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
              kind: Client
              metadata:
                name: setup-realm-management-client
              spec:
                # realm-management is a Keycloak-protected system client:
                # it already exists (hence `import: true` below) but any
                # PUT/update against it is rejected by Keycloak itself
                # with 403, regardless of what we set here. Excluding
                # "Update" stops Crossplane from perpetually retrying (and
                # failing) that update every reconcile -- we only need
                # this resource's observed external-name/ID so the Role
                # below can reference it.
                managementPolicies:
                  - Observe
                  - Create
                  - LateInitialize
                providerConfigRef:
                  name: default
                forProvider:
                  realmId: "setup"
                  clientId: "realm-management"
                  accessType: "BEARER-ONLY"
                  standardFlowEnabled: false
                  directAccessGrantsEnabled: false
                  implicitFlowEnabled: false
                  serviceAccountsEnabled: false
                  import: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.realmName
                toFieldPath: spec.forProvider.realmId

          # -------------------------------------------------------------
          # 7c. Import the "realm-admin" role (a built-in composite role on
          #     realm-management, granting full admin rights scoped to this
          #     one realm only -- not global/master-realm admin).
          # -------------------------------------------------------------
          - name: keycloak-realm-admin-role
            base:
              apiVersion: role.keycloak.crossplane.io/v1alpha1
              kind: Role
              metadata:
                name: setup-realm-admin-role
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  realmId: "setup"
                  name: "realm-admin"
                  import: true
                  clientIdRef:
                    name: setup-realm-management-client
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.realmName
                toFieldPath: spec.forProvider.realmId

          # -------------------------------------------------------------
          # 7d. Grant demo-user the realm-admin role, so they can manage
          #     the "setup" realm itself (not just log in to WordPress).
          # -------------------------------------------------------------
          - name: keycloak-demo-user-roles
            base:
              apiVersion: user.keycloak.crossplane.io/v1alpha1
              kind: Roles
              metadata:
                name: demo-user-roles
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  realmId: "setup"
                  exhaustive: false
                  userIdRef:
                    name: demo-user
                  roleIdsRefs:
                    - name: setup-realm-admin-role
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.realmName
                toFieldPath: spec.forProvider.realmId

          # -------------------------------------------------------------
          # 8. WordPress OIDC Client secret (consumed via
          #    clientSecretSecretRef). Sourced from Vault; see
          #    _helpers.tpl.
          # -------------------------------------------------------------
{{ include "crossplane-experiments.vaultBackedSecret" (dict
            "id" "wordpress-oidc-client"
            "secretName" "wordpress-oidc-client-secret"
            "secretNamespace" "default"
            "vaultPath" "wordpress/oidc-client-secret"
          ) | nindent 10 }}

          # -------------------------------------------------------------
          # 9. WordPress OIDC Client, scoped to the "setup" realm only
          # -------------------------------------------------------------
          - name: wordpress-oidc-client
            base:
              apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
              kind: Client
              metadata:
                name: wordpress-oidc-client
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  realmId: "setup"
                  clientId: "wordpress"
                  name: "WordPress OIDC Client"
                  enabled: true
                  accessType: "CONFIDENTIAL"
                  standardFlowEnabled: true
                  directAccessGrantsEnabled: true
                  clientSecretSecretRef:
                    name: wordpress-oidc-client-secret
                    namespace: default
                    key: client-secret
                  validRedirectUris:
                    - "http://wordpress.default.svc.cluster.local/*"
                    - "http://wordpress.default.svc.cluster.local/wp-login.php?action=openid-connect-authorize"
                    {{- if .Values.reverseProxy.enabled }}
                    # The browser actually lands back on the reverse
                    # proxy's externally-reachable URL (not the internal
                    # Service hostname) after authenticating at Keycloak,
                    # so that redirect target must be allow-listed too.
                    - "https://{{ .Values.reverseProxy.hostname }}:{{ .Values.reverseProxy.port }}/wordpress/*"
                    - "https://{{ .Values.reverseProxy.hostname }}:{{ .Values.reverseProxy.port }}/wordpress/wp-login.php?action=openid-connect-authorize"
                    {{- end }}
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.realmName
                toFieldPath: spec.forProvider.realmId

          # =================================================================
          # WORDPRESS: MariaDB-backed (mariadb-operator, NOT a Bitnami
          # subchart), authenticating via the OIDC plugin against the
          # Keycloak "setup" realm only
          # =================================================================

          # -------------------------------------------------------------
          # 10. MariaDB credentials for WordPress. Sourced from Vault;
          #     see _helpers.tpl.
          # -------------------------------------------------------------
{{ include "crossplane-experiments.vaultBackedSecret" (dict
            "id" "wordpress-mariadb"
            "secretName" "wordpress-mariadb-credentials"
            "secretNamespace" "default"
            "vaultPath" "wordpress/mariadb-credentials"
            "extraLabels" (dict "k8s.mariadb.com/watch" "true")
          ) | nindent 10 }}

          # -------------------------------------------------------------
          # 11. MariaDB database for WordPress, managed by mariadb-operator
          #     (cluster infra installed by the umbrella chart). The
          #     operator creates a Service named identically to this CR
          #     ("wordpress-mariadb"), confirmed against the live cluster.
          # -------------------------------------------------------------
          - name: wordpress-mariadb
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha1
              kind: Object
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: k8s.mariadb.com/v1alpha1
                    kind: MariaDB
                    metadata:
                      name: wordpress-mariadb
                      namespace: default
                    spec:
                      image: mariadb:11.4
                      port: 3306
                      database: wordpress
                      username: wordpress
                      rootPasswordSecretKeyRef:
                        name: wordpress-mariadb-credentials
                        key: root-password
                      passwordSecretKeyRef:
                        name: wordpress-mariadb-credentials
                        key: password
                      storage:
                        size: 2Gi
                      # mariadb-operator defaults to no resource
                      # requests/limits; cap the mariadb container for a
                      # small VM.
                      resources:
                        requests:
                          cpu: 50m
                          memory: 128Mi
                        limits:
                          cpu: 300m
                          memory: 256Mi

          # -------------------------------------------------------------
          # 12. WordPress admin account password (used by the wp-cli
          #     post-install hook Job inside our own WordPress chart).
          #     Sourced from Vault; see _helpers.tpl.
          # -------------------------------------------------------------
{{ include "crossplane-experiments.vaultBackedSecret" (dict
            "id" "wordpress-admin"
            "secretName" "wordpress-admin-secret"
            "secretNamespace" "default"
            "vaultPath" "wordpress/admin-secret"
          ) | nindent 10 }}

          # -------------------------------------------------------------
          # 13. WordPress (Helm Release), using our self-authored chart
          #     pulled from the in-cluster OCI registry (NOT Bitnami), the
          #     mariadb-operator-managed database, and the OIDC plugin
          #     locked to the Keycloak "setup" realm.
          # -------------------------------------------------------------
          - name: helm-wordpress
            base:
              apiVersion: helm.crossplane.io/v1beta1
              kind: Release
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  chart:
                    name: wordpress
                    repository: http://chart-registry.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.chartRegistry.port }}
                    version: {{ .Values.charts.wordpress.version | quote }}
                  namespace: default
                  values:
                    fullnameOverride: wordpress
                    # Our chart's `resources` default is `{}` (uncapped);
                    # set an explicit small budget for a resource-
                    # constrained VM.
                    resources:
                      requests:
                        cpu: 50m
                        memory: 128Mi
                      limits:
                        cpu: 300m
                        memory: 256Mi
                    {{- if .Values.reverseProxy.enabled }}
                    # Pins WP_HOME/WP_SITEURL to the reverse-proxy's
                    # externally-reachable /wordpress path, so every
                    # generated link/asset URL (CSS, JS, permalinks) works
                    # correctly from a browser outside the cluster, not
                    # just from the internal Service hostname.
                    externalUrl: "https://{{ .Values.reverseProxy.hostname }}:{{ .Values.reverseProxy.port }}/wordpress"
                    {{- end }}
                    database:
                      host: wordpress-mariadb.default.svc.cluster.local
                      port: 3306
                      name: wordpress
                      user: wordpress
                      existingSecret: wordpress-mariadb-credentials
                      passwordKey: password
                    admin:
                      existingSecret: wordpress-admin-secret
                      passwordKey: password
                    oidc:
                      enabled: true
                      clientId: wordpress
                      clientSecretExistingSecret: wordpress-oidc-client-secret
                      clientSecretKey: client-secret
                      # loginUrl/userinfoUrl/tokenUrl are fully replaced by
                      # the CombineFromComposite patch below, which pins
                      # them to the Keycloak "setup" realm ONLY.
                      loginUrl: ""
                      userinfoUrl: ""
                      tokenUrl: ""
                      issuer: ""
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.realmName
                  strategy: string
                  string:
                    {{- if .Values.reverseProxy.enabled }}
                    # This URL is embedded directly as the browser's
                    # "Login with OpenID Connect" link href, so (unlike
                    # userinfo/token below, which the WordPress container
                    # calls server-to-server over the internal Service
                    # hostname) it MUST be reachable from outside the
                    # cluster -- i.e. through the reverse proxy.
                    fmt: "https://{{ .Values.reverseProxy.hostname }}:{{ .Values.reverseProxy.port }}/keycloak/realms/%s/protocol/openid-connect/auth"
                    {{- else }}
                    fmt: "http://keycloak-http.default.svc.cluster.local/realms/%s/protocol/openid-connect/auth"
                    {{- end }}
                toFieldPath: spec.forProvider.values.oidc.loginUrl
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.realmName
                  strategy: string
                  string:
                    fmt: "http://keycloak-http.default.svc.cluster.local{{ $kcPath }}/realms/%s/protocol/openid-connect/userinfo"
                toFieldPath: spec.forProvider.values.oidc.userinfoUrl
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.realmName
                  strategy: string
                  string:
                    fmt: "http://keycloak-http.default.svc.cluster.local{{ $kcPath }}/realms/%s/protocol/openid-connect/token"
                toFieldPath: spec.forProvider.values.oidc.tokenUrl
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.realmName
                  strategy: string
                  string:
                    # Keycloak's real token "iss" claim is scheme+host+port
                    # PLUS the /realms/<realm> path (unlike what the OIDC
                    # plugin derives from endpoint_login, which keeps only
                    # scheme+host+port) -- set this explicitly so ID-token
                    # issuer validation doesn't false-positive as
                    # "invalid-iss". Must match whichever hostname KC_HOSTNAME
                    # pins the token's "iss" claim to (external when the
                    # reverse proxy is enabled, internal otherwise).
                    {{- if .Values.reverseProxy.enabled }}
                    fmt: "https://{{ .Values.reverseProxy.hostname }}:{{ .Values.reverseProxy.port }}/keycloak/realms/%s"
                    {{- else }}
                    fmt: "http://keycloak-http.default.svc.cluster.local/realms/%s"
                    {{- end }}
                toFieldPath: spec.forProvider.values.oidc.issuer
