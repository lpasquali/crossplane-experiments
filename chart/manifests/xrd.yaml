apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xappenvironments.apps.example.org
spec:
  group: apps.example.org
  names:
    kind: XAppEnvironment
    plural: xappenvironments
  claimNames:
    kind: AppEnvironment
    plural: appenvironments
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              # No passwords/secrets live here on purpose: every credential
              # this demo uses is generated directly in Vault (the actual
              # source of truth) by a one-time seeding step in the
              # bootstrap-apply Job, then read back out via ExternalSecrets
              # -- see chart/templates/_helpers.tpl's vaultBackedSecret and
              # the README's "Changing a vaulted secret's value" section.
              # A claim/XRD spec field is a poor place for a secret: it's
              # stored in plaintext in etcd and shows up in plain
              # `kubectl get -o yaml`/`helm get values` output.
              properties:
                realmName:
                  type: string
                  default: "setup"
                  description: "Keycloak realm that WordPress is allowed to authenticate against"
                demoUserName:
                  type: string
                  default: "demo-user"
                  description: "Username for the demo Keycloak user created in the realm (also admin of that realm and of WordPress)"
