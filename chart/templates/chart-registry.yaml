{{- if .Values.chartRegistry.enabled }}
---
# In-cluster Helm chart repository hosting our self-authored WordPress
# chart, served as plain static files by nginx (official, non-Bitnami
# image) over classic HTTP. We deliberately avoid an OCI registry here:
# provider-helm's OCI client builds its registry.Client with no TLS
# options at all, ignoring insecureSkipTLSVerify during manifest
# resolution (confirmed upstream bug, provider-helm v1.4.0), so pulling
# from a self-signed-TLS OCI registry fails. The classic chart-repo
# protocol (index.yaml + tarball over plain HTTP) has no such issue.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chart-registry-files
data:
  index.yaml: |
{{ .Files.Get "files/index.yaml" | indent 4 }}
binaryData:
  wordpress-{{ .Values.charts.wordpress.version }}.tgz: {{ .Files.Get (printf "files/wordpress-%s.tgz" .Values.charts.wordpress.version) | b64enc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chart-registry
  labels:
    app.kubernetes.io/name: chart-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chart-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chart-registry
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: chart-files
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /index.yaml
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: chart-files
          configMap:
            name: chart-registry-files
---
apiVersion: v1
kind: Service
metadata:
  name: chart-registry
spec:
  selector:
    app.kubernetes.io/name: chart-registry
  ports:
    - port: {{ .Values.chartRegistry.port }}
      targetPort: 80
{{- end }}
