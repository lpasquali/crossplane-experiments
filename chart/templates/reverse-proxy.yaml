# =====================================================================
# Reverse proxy exposing the whole demo over a single external URL
# (https://{{ .Values.reverseProxy.hostname }}:{{ .Values.reverseProxy.port }}),
# path-routing:
#   /wordpress -> the WordPress Service (default/wordpress)
#   /keycloak  -> the Keycloak Service (default/keycloak-http)
#
# This is plain nginx (official image, non-Bitnami) terminating TLS with
# a self-signed cert generated at install time via Helm's
# genSelfSignedCert. The Service is a NodePort so it can be reached from
# outside kind via the extraPortMappings entry in kind-config.yaml
# (host port {{ .Values.reverseProxy.port }} -> node port
# {{ .Values.reverseProxy.nodePort }}).
#
# Note: WordPress and Keycloak were both configured with their own
# internal Service hostnames as their site/base URL, so some
# absolutely-linked assets/redirects may still point at the internal
# name rather than this proxy's external URL. This proxy is primarily
# meant to let you confirm both apps are up and reachable end-to-end
# (HTTP status, login page rendering) through one external address.
# =====================================================================
{{- if .Values.reverseProxy.enabled }}
{{- $cn := .Values.reverseProxy.hostname }}
{{- $ca := genSelfSignedCert $cn (list "127.0.0.1") (list $cn "localhost") 3650 }}
apiVersion: v1
kind: Secret
metadata:
  name: reverse-proxy-tls
type: kubernetes.io/tls
data:
  tls.crt: {{ $ca.Cert | b64enc }}
  tls.key: {{ $ca.Key | b64enc }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reverse-proxy-conf
data:
  nginx.conf.template: |
    events {}
    http {
      # Resolve upstream hostnames at request time (via variables) rather
      # than at nginx startup, so this proxy starts successfully even
      # before the WordPress/Keycloak Services exist yet (e.g. while the
      # Crossplane claim is still provisioning them). ${RESOLVER_IP} is
      # substituted at container startup from the pod's own
      # /etc/resolv.conf nameserver (i.e. the cluster's DNS Service IP),
      # so this works regardless of the cluster's Service CIDR.
      resolver ${RESOLVER_IP} valid=10s;

      server {
        listen {{ .Values.reverseProxy.port }} ssl;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        location = / {
          return 200 "crossplane-experiments demo\n/wordpress -> WordPress\n/keycloak  -> Keycloak\n";
          add_header Content-Type text/plain;
        }

        location /wordpress/ {
          set $wordpress_upstream wordpress.default.svc.cluster.local;
          proxy_pass http://$wordpress_upstream/;
          proxy_set_header Host wordpress.default.svc.cluster.local;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /keycloak/ {
          set $keycloak_upstream keycloak-http.default.svc.cluster.local;
          proxy_pass http://$keycloak_upstream/;
          proxy_set_header Host keycloak-http.default.svc.cluster.local;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $remote_addr;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reverse-proxy
  labels:
    app: reverse-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reverse-proxy
  template:
    metadata:
      labels:
        app: reverse-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          command:
            - sh
            - -c
            - |
              set -e
              RESOLVER_IP="$(awk '/^nameserver/{print $2; exit}' /etc/resolv.conf)"
              RESOLVER_IP="$RESOLVER_IP" envsubst '${RESOLVER_IP}' \
                < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: {{ .Values.reverseProxy.port }}
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: reverse-proxy-conf
        - name: tls
          secret:
            secretName: reverse-proxy-tls
---
apiVersion: v1
kind: Service
metadata:
  name: reverse-proxy
spec:
  type: NodePort
  selector:
    app: reverse-proxy
  ports:
    - port: {{ .Values.reverseProxy.port }}
      targetPort: {{ .Values.reverseProxy.port }}
      nodePort: {{ .Values.reverseProxy.nodePort }}
{{- end }}
