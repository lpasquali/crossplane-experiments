# =====================================================================
# Several resources in this chart reference CRDs that are NOT available
# immediately at `helm install` time on a genuinely fresh cluster:
#   - Function/Provider (pkg.crossplane.io): Crossplane's own core CRDs
#     are installed by the crossplane pod itself once it starts running
#     (they are NOT shipped as static CRDs in the crossplane chart), so
#     they don't exist yet at the instant Helm validates this release's
#     manifests.
#   - CompositeResourceDefinition/Composition (apiextensions.crossplane.io):
#     same story, same core CRDs.
#   - ProviderConfigs: come from the Provider *packages* above, pulled
#     and installed asynchronously by Crossplane's package manager.
#   - The demo AppEnvironment claim: comes from our own XRD, established
#     asynchronously once Crossplane reconciles it.
# Helm validates every templated manifest against the API server's known
# types at apply time, so none of the above can be plain templates in a
# one-shot install - a post-install hook Job waits for each CRD to show
# up (in dependency order), then applies the corresponding manifest with
# kubectl. The manifests themselves live under chart/manifests/ (NOT
# chart/templates/) specifically so Helm does not try to render+apply
# them directly; they're only ever rendered via `tpl` into this
# ConfigMap and applied by the hook Job below.
# =====================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bootstrap-apply
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bootstrap-apply
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: bootstrap-apply
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bootstrap-manifests
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  providers-and-functions.yaml: |
{{ tpl (.Files.Get "manifests/providers-and-functions.yaml") . | indent 4 }}
  xrd.yaml: |
{{ tpl (.Files.Get "manifests/xrd.yaml") . | indent 4 }}
  composition.yaml: |
{{ tpl (.Files.Get "manifests/composition.yaml") . | indent 4 }}
  provider-configs.yaml: |
    ---
    # In-cluster ProviderConfig for Provider Helm
    apiVersion: helm.crossplane.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
    spec:
      credentials:
        source: InjectedIdentity
    ---
    # In-cluster ProviderConfig for Provider Kubernetes
    apiVersion: kubernetes.crossplane.io/v1alpha1
    kind: ProviderConfig
    metadata:
      name: default
    spec:
      credentials:
        source: InjectedIdentity
    ---
    # ProviderConfig for Provider Keycloak. The referenced secret is produced
    # by the Composition itself, once the in-cluster Keycloak Helm release
    # has been composed by a claim.
    apiVersion: keycloak.crossplane.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
    spec:
      credentials:
        source: Secret
        secretRef:
          namespace: {{ .Release.Namespace }}
          name: keycloak-admin-creds
          key: credentials
    ---
    # Dev-mode Vault's fixed root token, wrapped two ways: "credentials"
    # (JSON, consumed by provider-vault's ProviderConfig) and "token"
    # (raw value, consumed by External Secrets Operator's SecretStore).
    # NOT how you'd authenticate to a real Vault -- fine for this
    # throwaway kind demo (see chart/values.yaml vault.server.dev).
    apiVersion: v1
    kind: Secret
    metadata:
      name: vault-provider-creds
      namespace: {{ .Release.Namespace }}
    type: Opaque
    stringData:
      credentials: |
        {"token_name": "crossplane-demo", "token": "{{ .Values.vault.server.dev.devRootToken }}"}
      token: {{ .Values.vault.server.dev.devRootToken | quote }}
    ---
    # ProviderConfig for Provider Vault.
    apiVersion: vault.upbound.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
    spec:
      address: "http://vault.{{ .Release.Namespace }}.svc.cluster.local:8200"
      credentials:
        source: Secret
        secretRef:
          namespace: {{ .Release.Namespace }}
          name: vault-provider-creds
          key: credentials
    ---
    # ClusterSecretStore for External Secrets Operator: reads secrets
    # back out of the same in-cluster Vault that the Composition's
    # SecretV2 resources write into, materializing them as native
    # Kubernetes Secrets for every existing consumer (Helm chart
    # values, provider-kubernetes Objects) to keep reading unchanged.
    apiVersion: external-secrets.io/v1
    kind: ClusterSecretStore
    metadata:
      name: vault-backend
    spec:
      provider:
        vault:
          server: "http://vault.{{ .Release.Namespace }}.svc.cluster.local:8200"
          path: {{ .Values.vaultSecrets.mount | quote }}
          version: "v2"
          auth:
            tokenSecretRef:
              name: vault-provider-creds
              namespace: {{ .Release.Namespace }}
              key: token
  {{- if .Values.claim.enabled }}
  claim.yaml: |
    apiVersion: platform.spindox.it/v1alpha1
    kind: AppEnvironment
    metadata:
      name: {{ .Values.claim.name }}
      namespace: {{ .Values.claim.namespace }}
    spec:
      realmName: {{ .Values.claim.realmName | quote }}
      demoUserName: {{ .Values.claim.demoUserName | quote }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-apply
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 1200
  template:
    spec:
      serviceAccountName: bootstrap-apply
      restartPolicy: Never
      containers:
        - name: apply
          # Community-maintained (non-Bitnami) kubectl image.
          image: alpine/k8s:1.30.3
          command:
            - sh
            - -c
            - |
              set -e

              # -----------------------------------------------------------
              # Seed Vault (the actual source of truth for every password/
              # secret this demo uses) BEFORE applying anything Crossplane-
              # related, so the ExternalSecrets the Composition creates
              # always find real data on their very first sync attempt.
              # Idempotent: only ever writes a path that doesn't already
              # have data, so re-running `helm upgrade` never rotates or
              # clobbers an existing deployment's secrets. Vault itself is
              # a Helm chart dependency of this same release, so it may
              # still be starting up when this Job starts -- wait for it.
              # -----------------------------------------------------------
              VAULT_ADDR="http://vault.{{ .Release.Namespace }}.svc.cluster.local:8200"
              VAULT_TOKEN="{{ .Values.vault.server.dev.devRootToken }}"
              VAULT_MOUNT="{{ .Values.vaultSecrets.mount }}"

              echo "Waiting for Vault to be reachable..."
              until curl -sf -o /dev/null "$VAULT_ADDR/v1/sys/health?standbyok=true"; do sleep 5; done

              # 32 url-safe random chars from /dev/urandom -- no openssl in
              # this image, so base64 + tr is the portable equivalent.
              rand() {
                head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32
              }

              # $1 = path under $VAULT_MOUNT/data/, $2 = JSON object to
              # store (becomes KV-v2's "data" field). Skips writing if the
              # path already has data (any HTTP 200 from a GET), so this is
              # safe to run on every helm install/upgrade.
              seed_if_absent() {
                path="$1"; body="$2"
                code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/$VAULT_MOUNT/data/$path")
                if [ "$code" = "200" ]; then
                  echo "Vault path $path already seeded, leaving it as-is."
                  return 0
                fi
                echo "Seeding Vault path $path..."
                curl -sf -H "X-Vault-Token: $VAULT_TOKEN" -H "Content-Type: application/json" \
                  -X POST -d "{\"data\": $body}" "$VAULT_ADDR/v1/$VAULT_MOUNT/data/$path" >/dev/null
              }

              KC_DB_PW="{{ .Values.vaultSecrets.seedOverrides.keycloakDbPassword }}"
              [ -z "$KC_DB_PW" ] && KC_DB_PW="$(rand)"
              seed_if_absent "keycloak/db-credentials" "{\"username\":\"keycloak\",\"password\":\"$KC_DB_PW\"}"

              KC_ADMIN_PW="{{ .Values.vaultSecrets.seedOverrides.keycloakAdminPassword }}"
              [ -z "$KC_ADMIN_PW" ] && KC_ADMIN_PW="$(rand)"
              seed_if_absent "keycloak/admin-secret" "{\"admin-password\":\"$KC_ADMIN_PW\"}"

              KC_DEMO_PW="{{ .Values.vaultSecrets.seedOverrides.keycloakDemoUserPassword }}"
              [ -z "$KC_DEMO_PW" ] && KC_DEMO_PW="$(rand)"
              seed_if_absent "keycloak/demo-user-password" "{\"password\":\"$KC_DEMO_PW\"}"

              WP_OIDC_SECRET="{{ .Values.vaultSecrets.seedOverrides.wordpressOidcClientSecret }}"
              [ -z "$WP_OIDC_SECRET" ] && WP_OIDC_SECRET="$(rand)"
              seed_if_absent "wordpress/oidc-client-secret" "{\"client-secret\":\"$WP_OIDC_SECRET\"}"

              # Independent root/app passwords (unlike the old claim-based
              # flow, which reused a single value for both).
              WP_DB_ROOT_PW="{{ .Values.vaultSecrets.seedOverrides.wordpressMariadbRootPassword }}"
              [ -z "$WP_DB_ROOT_PW" ] && WP_DB_ROOT_PW="$(rand)"
              WP_DB_PW="{{ .Values.vaultSecrets.seedOverrides.wordpressMariadbPassword }}"
              [ -z "$WP_DB_PW" ] && WP_DB_PW="$(rand)"
              seed_if_absent "wordpress/mariadb-credentials" "{\"root-password\":\"$WP_DB_ROOT_PW\",\"password\":\"$WP_DB_PW\"}"

              WP_ADMIN_PW="{{ .Values.vaultSecrets.seedOverrides.wordpressAdminPassword }}"
              [ -z "$WP_ADMIN_PW" ] && WP_ADMIN_PW="$(rand)"
              seed_if_absent "wordpress/admin-secret" "{\"password\":\"$WP_ADMIN_PW\"}"

              echo "Waiting for Crossplane core CRDs (functions, providers)..."
              for crd in functions.pkg.crossplane.io \
                         providers.pkg.crossplane.io; do
                until kubectl get crd "$crd" >/dev/null 2>&1; do sleep 5; done
              done
              kubectl apply -f /manifests/providers-and-functions.yaml

              echo "Waiting for Crossplane core CRDs (XRD/Composition)..."
              for crd in compositeresourcedefinitions.apiextensions.crossplane.io \
                         compositions.apiextensions.crossplane.io; do
                until kubectl get crd "$crd" >/dev/null 2>&1; do sleep 5; done
              done
              kubectl apply -f /manifests/xrd.yaml
              kubectl apply -f /manifests/composition.yaml

              echo "Waiting for provider-helm/kubernetes/keycloak CRDs (ProviderConfig)..."
              for crd in providerconfigs.helm.crossplane.io \
                         providerconfigs.kubernetes.crossplane.io \
                         providerconfigs.keycloak.crossplane.io \
                         providerconfigs.vault.upbound.io \
                         clustersecretstores.external-secrets.io; do
                echo "Waiting for CRD $crd to be established..."
                until kubectl get crd "$crd" >/dev/null 2>&1; do sleep 5; done
              done
              kubectl apply -f /manifests/provider-configs.yaml
              {{- if .Values.claim.enabled }}
              echo "Waiting for CRD appenvironments.platform.spindox.it to be established..."
              until kubectl get crd appenvironments.platform.spindox.it >/dev/null 2>&1; do sleep 5; done
              kubectl apply -f /manifests/claim.yaml
              {{- end }}
          volumeMounts:
            - name: manifests
              mountPath: /manifests
      volumes:
        - name: manifests
          configMap:
            name: bootstrap-manifests
