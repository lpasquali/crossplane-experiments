# =====================================================================
# Several resources in this chart reference CRDs that are NOT available
# immediately at `helm install` time on a genuinely fresh cluster:
#   - Function/Provider (pkg.crossplane.io): Crossplane's own core CRDs
#     are installed by the crossplane pod itself once it starts running
#     (they are NOT shipped as static CRDs in the crossplane chart), so
#     they don't exist yet at the instant Helm validates this release's
#     manifests.
#   - CompositeResourceDefinition/Composition (apiextensions.crossplane.io):
#     same story, same core CRDs.
#   - ProviderConfigs: come from the Provider *packages* above, pulled
#     and installed asynchronously by Crossplane's package manager.
#   - The demo AppEnvironment claim: comes from our own XRD, established
#     asynchronously once Crossplane reconciles it.
# Helm validates every templated manifest against the API server's known
# types at apply time, so none of the above can be plain templates in a
# one-shot install - a post-install hook Job waits for each CRD to show
# up (in dependency order), then applies the corresponding manifest with
# kubectl. The manifests themselves live under chart/manifests/ (NOT
# chart/templates/) specifically so Helm does not try to render+apply
# them directly; they're only ever rendered via `tpl` into this
# ConfigMap and applied by the hook Job below.
# =====================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bootstrap-apply
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bootstrap-apply
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: bootstrap-apply
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bootstrap-manifests
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  providers-and-functions.yaml: |
{{ tpl (.Files.Get "manifests/providers-and-functions.yaml") . | indent 4 }}
  xrd.yaml: |
{{ tpl (.Files.Get "manifests/xrd.yaml") . | indent 4 }}
  composition.yaml: |
{{ tpl (.Files.Get "manifests/composition.yaml") . | indent 4 }}
  provider-configs.yaml: |
    ---
    # In-cluster ProviderConfig for Provider Helm
    apiVersion: helm.crossplane.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
    spec:
      credentials:
        source: InjectedIdentity
    ---
    # In-cluster ProviderConfig for Provider Kubernetes
    apiVersion: kubernetes.crossplane.io/v1alpha1
    kind: ProviderConfig
    metadata:
      name: default
    spec:
      credentials:
        source: InjectedIdentity
    ---
    # ProviderConfig for Provider Keycloak. The referenced secret is produced
    # by the Composition itself, once the in-cluster Keycloak Helm release
    # has been composed by a claim.
    apiVersion: keycloak.crossplane.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
    spec:
      credentials:
        source: Secret
        secretRef:
          namespace: {{ .Release.Namespace }}
          name: keycloak-admin-creds
          key: credentials
    ---
    # Dev-mode Vault's fixed root token, wrapped two ways: "credentials"
    # (JSON, consumed by provider-vault's ProviderConfig) and "token"
    # (raw value, consumed by External Secrets Operator's SecretStore).
    # NOT how you'd authenticate to a real Vault -- fine for this
    # throwaway kind demo (see chart/values.yaml vault.server.dev).
    apiVersion: v1
    kind: Secret
    metadata:
      name: vault-provider-creds
      namespace: {{ .Release.Namespace }}
    type: Opaque
    stringData:
      credentials: |
        {"token_name": "crossplane-demo", "token": "{{ .Values.vault.server.dev.devRootToken }}"}
      token: {{ .Values.vault.server.dev.devRootToken | quote }}
    ---
    # ProviderConfig for Provider Vault.
    apiVersion: vault.upbound.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
    spec:
      address: "http://vault.{{ .Release.Namespace }}.svc.cluster.local:8200"
      credentials:
        source: Secret
        secretRef:
          namespace: {{ .Release.Namespace }}
          name: vault-provider-creds
          key: credentials
    ---
    # ClusterSecretStore for External Secrets Operator: reads secrets
    # back out of the same in-cluster Vault that the Composition's
    # SecretV2 resources write into, materializing them as native
    # Kubernetes Secrets for every existing consumer (Helm chart
    # values, provider-kubernetes Objects) to keep reading unchanged.
    apiVersion: external-secrets.io/v1
    kind: ClusterSecretStore
    metadata:
      name: vault-backend
    spec:
      provider:
        vault:
          server: "http://vault.{{ .Release.Namespace }}.svc.cluster.local:8200"
          path: {{ .Values.vaultSecrets.mount | quote }}
          version: "v2"
          auth:
            tokenSecretRef:
              name: vault-provider-creds
              namespace: {{ .Release.Namespace }}
              key: token
  {{- if .Values.claim.enabled }}
  claim.yaml: |
    apiVersion: apps.example.org/v1alpha1
    kind: AppEnvironment
    metadata:
      name: {{ .Values.claim.name }}
      namespace: {{ .Values.claim.namespace }}
    spec:
      dbPassword: {{ .Values.claim.dbPassword | quote }}
      realmName: {{ .Values.claim.realmName | quote }}
      keycloakAdminPassword: {{ .Values.claim.keycloakAdminPassword | quote }}
      wordpressDbPassword: {{ .Values.claim.wordpressDbPassword | quote }}
      oidcClientSecret: {{ .Values.claim.oidcClientSecret | quote }}
      demoUserName: {{ .Values.claim.demoUserName | quote }}
      demoUserPassword: {{ .Values.claim.demoUserPassword | quote }}
      wordpressAdminPassword: {{ .Values.claim.wordpressAdminPassword | quote }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-apply
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 1200
  template:
    spec:
      serviceAccountName: bootstrap-apply
      restartPolicy: Never
      containers:
        - name: apply
          # Community-maintained (non-Bitnami) kubectl image.
          image: alpine/k8s:1.30.3
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for Crossplane core CRDs (functions, providers)..."
              for crd in functions.pkg.crossplane.io \
                         providers.pkg.crossplane.io; do
                until kubectl get crd "$crd" >/dev/null 2>&1; do sleep 5; done
              done
              kubectl apply -f /manifests/providers-and-functions.yaml

              echo "Waiting for Crossplane core CRDs (XRD/Composition)..."
              for crd in compositeresourcedefinitions.apiextensions.crossplane.io \
                         compositions.apiextensions.crossplane.io; do
                until kubectl get crd "$crd" >/dev/null 2>&1; do sleep 5; done
              done
              kubectl apply -f /manifests/xrd.yaml
              kubectl apply -f /manifests/composition.yaml

              echo "Waiting for provider-helm/kubernetes/keycloak CRDs (ProviderConfig)..."
              for crd in providerconfigs.helm.crossplane.io \
                         providerconfigs.kubernetes.crossplane.io \
                         providerconfigs.keycloak.crossplane.io \
                         providerconfigs.vault.upbound.io \
                         clustersecretstores.external-secrets.io; do
                echo "Waiting for CRD $crd to be established..."
                until kubectl get crd "$crd" >/dev/null 2>&1; do sleep 5; done
              done
              kubectl apply -f /manifests/provider-configs.yaml
              {{- if .Values.claim.enabled }}
              echo "Waiting for CRD appenvironments.apps.example.org to be established..."
              until kubectl get crd appenvironments.apps.example.org >/dev/null 2>&1; do sleep 5; done
              kubectl apply -f /manifests/claim.yaml
              {{- end }}
          volumeMounts:
            - name: manifests
              mountPath: /manifests
      volumes:
        - name: manifests
          configMap:
            name: bootstrap-manifests
