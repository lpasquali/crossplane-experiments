apiVersion: v2
name: crossplane-experiments
description: >
  One-command Crossplane demo: WordPress + Keycloak + MariaDB (for
  WordPress) + PostgreSQL (for Keycloak), composed via a single Crossplane
  Composition. WordPress authenticates only against the Keycloak "setup"
  realm. No Bitnami charts/images are used anywhere in this stack.
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  # Crossplane itself (official chart).
  - name: crossplane
    version: 2.4.2
    repository: https://charts.crossplane.io/stable
    condition: crossplane.enabled
  # CloudNativePG operator (official chart), used for Keycloak's Postgres.
  - name: cloudnative-pg
    version: 0.29.1
    repository: https://cloudnative-pg.github.io/charts
    condition: cloudnative-pg.enabled
  # mariadb-operator (official chart), used for WordPress's MariaDB.
  - name: mariadb-operator
    version: 26.10.1
    repository: oci://ghcr.io/mariadb-operator/charts
    condition: mariadb-operator.enabled
  # HashiCorp Vault (official chart), dev-mode single instance used as the
  # source of truth for every secret in this demo (see provider-vault /
  # External Secrets Operator below). NOT production-safe as configured
  # (in-memory storage, auto-unsealed, fixed root token) -- fine for a
  # throwaway kind cluster.
  - name: vault
    version: 0.34.1
    repository: https://helm.releases.hashicorp.com
    condition: vault.enabled
  # External Secrets Operator (official, CNCF project, non-Bitnami): syncs
  # secret material FROM Vault back into native Kubernetes Secrets, so
  # every existing consumer (Helm chart values, provider-kubernetes
  # Objects) keeps reading a plain Secret and needs no changes.
  - name: external-secrets
    version: 2.12.0
    repository: https://charts.external-secrets.io
    condition: external-secrets.enabled
