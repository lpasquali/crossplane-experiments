# =====================================================================
# Cluster infrastructure (installed once, as Helm chart dependencies)
# =====================================================================
crossplane:
  enabled: true
  # Chart defaults are fairly generous (500m/1Gi core, 100m/512Mi RBAC
  # manager) for a demo on a resource-constrained VM; trim them down.
  resourcesCrossplane:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  resourcesRBACManager:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 20m
      memory: 64Mi

cloudnative-pg:
  enabled: true
  # Operator defaults to no resource requests/limits; without a cap, its
  # controller process is free to burst and compete with the actual
  # workload pods (keycloak, wordpress, etc) for CPU on a small VM.
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

mariadb-operator:
  enabled: true
  crds:
    enabled: true
  # Same rationale as cloudnative-pg above: cap the operator's own
  # controller/webhook/cert-controller pods, which otherwise run with no
  # resource requests/limits at all.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 128Mi
  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
  certController:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi

# =====================================================================
# HashiCorp Vault - single source of truth for every secret this demo
# generates (passwords, OIDC client secret, etc). Dev-mode only: a
# single in-memory, auto-unsealed instance with a fixed root token --
# NOT production-safe, but fine for a throwaway kind cluster.
# =====================================================================
vault:
  enabled: true
  # Pins the chart's generated resource names (Service, StatefulSet, etc)
  # to a fixed "vault" prefix regardless of the umbrella release name, so
  # the hardcoded "vault.<namespace>.svc.cluster.local" hostnames used by
  # the Crossplane ProviderConfig and ExternalSecrets ClusterSecretStore
  # (see bootstrap-apply.yaml) always resolve correctly.
  fullnameOverride: vault
  server:
    # No resource requests/limits by default; Vault dev-mode is tiny but
    # otherwise has no ceiling on CPU/memory at all.
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    dev:
      enabled: true
      devRootToken: "root"
    standalone:
      enabled: false
    ha:
      enabled: false
    # Default exec probe ("vault status -tls-skip-verify") can time out
    # on slower/CI-like nodes within its default 3s budget even once
    # Vault is actually up; switch to a plain httpGet probe (cheaper,
    # no subprocess) and give it more headroom.
    readinessProbe:
      enabled: true
      path: "/v1/sys/health?standbyok=true"
      timeoutSeconds: 10
      periodSeconds: 5
      failureThreshold: 6
  injector:
    enabled: false
  ui:
    # Exposed through the reverse proxy at /ui/ and /v1/ (Vault's UI
    # hardcodes its own asset/API paths to those two roots -- it has
    # no equivalent of Keycloak's relativePath, so it can't be rebased
    # under a "/vault" prefix; see reverse-proxy-nginx.conf.template).
    enabled: true

# =====================================================================
# External Secrets Operator - syncs secret material FROM Vault back
# into native Kubernetes Secrets, so every existing consumer (Helm
# chart values, provider-kubernetes Objects) keeps reading a plain
# Secret unchanged.
# =====================================================================
external-secrets:
  enabled: true
  installCRDs: true
  # Controller/webhook/cert-controller all default to no resource
  # requests/limits; cap them for a resource-constrained VM.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
  certController:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi

# =====================================================================
# In-cluster Helm chart repository (classic HTTP, nginx) hosting our
# self-authored WordPress chart, embedded from chart/files/*.
# =====================================================================
chartRegistry:
  enabled: true
  port: 8080

# =====================================================================
# Crossplane packages/providers used by the demo's Composition
# =====================================================================
providers:
  functionPatchAndTransform: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.8.0
  providerHelm: xpkg.upbound.io/crossplane-contrib/provider-helm:v1.4.0
  providerKubernetes: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v0.12.0
  providerKeycloak: xpkg.upbound.io/crossplane-contrib/provider-keycloak:v2.1.0
  providerVault: xpkg.upbound.io/upbound/provider-vault:v4.0.4

# =====================================================================
# HashiCorp Vault mount used by the Composition's ExternalSecret
# resources (see composition.yaml). The address is always
# http://vault.<Release.Namespace>.svc.cluster.local:8200 since Vault
# is installed as a dependency into this same release/namespace.
# "secret" is Vault dev-mode's auto-enabled KV-v2 engine.
#
# Vault is the ACTUAL source of truth for every password/secret this
# demo uses -- none of them are claim/Helm-values fields (a claim's
# spec is stored in plaintext in etcd and shows up in plain
# `kubectl get -o yaml`/`helm get values` output, which is a bad place
# for a secret). Instead, a one-time seeding step in the
# bootstrap-apply Job writes a cryptographically random value straight
# into each Vault path below, but ONLY if that path doesn't already
# have one -- so re-running `helm upgrade` never rotates/clobbers an
# existing deployment's secrets, same as before.
#
# seedOverrides lets you pin a specific value instead of a random one
# (purely for CI/reproducible-demo purposes) -- each is used only the
# first time its Vault path is seeded; leave blank for a random value.
# See README's "Changing a vaulted secret's value" section for why
# editing the value in Vault's UI *after* it's seeded doesn't work.
# =====================================================================
vaultSecrets:
  mount: secret
  seedOverrides:
    keycloakDbPassword: ""
    keycloakAdminPassword: ""
    keycloakDemoUserPassword: ""
    wordpressOidcClientSecret: ""
    wordpressMariadbRootPassword: ""
    wordpressMariadbPassword: ""
    wordpressAdminPassword: ""

# =====================================================================
# Chart versions used inside the Composition (non-Bitnami)
# =====================================================================
charts:
  keycloakx:
    repository: https://codecentric.github.io/helm-charts
    version: 7.3.2
  # Our own chart, served from the in-cluster chart-registry (plain-HTTP
  # nginx static file server, see templates/chart-registry.yaml), built
  # from charts/wordpress/ via scripts/build-charts.sh.
  wordpress:
    version: 0.1.7

# =====================================================================
# Reverse proxy exposing the demo over a single external URL:
#   https://<hostname>:<nodePort> /wordpress  -> the WordPress Service
#   https://<hostname>:<nodePort> /keycloak   -> the keycloak-http Service
# TLS is a self-signed cert generated at install time (Helm's
# genSelfSignedCert); the Service is a NodePort so it can be reached
# from outside kind via an extraPortMappings entry in kind-config.yaml.
# =====================================================================
reverseProxy:
  enabled: true
  # Name the BROWSER uses to reach the proxy (baked into the TLS cert,
  # Keycloak issuer and OIDC redirect URIs). Not tied to the VM hostname.
  # "localhost" works with no /etc/hosts edit (e.g. via an SSH tunnel);
  # for remote access override it, e.g.
  #   --set reverseProxy.hostname=<vm-ip-or-dns-name>
  hostname: localhost
  port: 9443
  nodePort: 30443


# =====================================================================
# Demo claim. Disable (claim.enabled=false) if you only want the platform
# (Crossplane + XRD/Composition + infra) installed, without instantiating
# a demo environment.
# =====================================================================
claim:
  enabled: true
  name: dev-environment
  namespace: default
  realmName: "faggeta"
  demoUserName: "boletus"
