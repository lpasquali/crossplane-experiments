{{- $urlPath := "" }}
{{- if .Values.externalUrl }}
{{- $urlPath = (urlParse .Values.externalUrl).path }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wordpress.fullname" . }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "wordpress.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wordpress.selectorLabels" . | nindent 8 }}
      {{- if and $urlPath (ne $urlPath "/") }}
      annotations:
        # Forces a pod restart whenever the Apache sub-path Alias
        # config changes, since it's read once at container startup.
        checksum/apache-subpath: {{ include (print $.Template.BasePath "/apache-subpath-configmap.yaml") . | sha256sum }}
      {{- end }}
    spec:
      {{- if .Values.oidc.enabled }}
      # Downloads (idempotently) the daggerhart-openid-connect-generic
      # plugin straight from wordpress.org directly into the shared
      # wp-content/plugins directory. No Bitnami image or packaging involved.
      initContainers:
        - name: install-oidc-plugin
          image: {{ .Values.pluginFetcherImage }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache curl unzip >/dev/null
              mkdir -p /var/www/html/wp-content/plugins
              if [ ! -d "/var/www/html/wp-content/plugins/{{ .Values.oidc.pluginSlug }}" ]; then
                echo "Downloading {{ .Values.oidc.pluginSlug }} plugin..."
                curl -fsSL -o /tmp/oidc-plugin.zip \
                  "https://downloads.wordpress.org/plugin/{{ .Values.oidc.pluginSlug }}.latest-stable.zip"
                unzip -q /tmp/oidc-plugin.zip -d /var/www/html/wp-content/plugins/
                rm -f /tmp/oidc-plugin.zip
              else
                echo "{{ .Values.oidc.pluginSlug }} plugin already present, skipping download"
              fi
          volumeMounts:
            - name: wp-data
              mountPath: /var/www/html
      {{- end }}
      containers:
        - name: wordpress
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: "{{ .Values.database.host }}:{{ .Values.database.port }}"
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.database.user | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            {{- if .Values.oidc.enabled }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.clientSecretExistingSecret }}
                  key: {{ .Values.oidc.clientSecretKey }}
            {{- end }}
            {{- if or .Values.externalUrl .Values.oidc.enabled }}
            # These wp-config.php constants take precedence over any
            # DB-stored options, so:
            #  - WP_HOME/WP_SITEURL are pinned to the externally-reachable
            #    URL (e.g. the reverse-proxy's /wordpress path) when set,
            #    so every generated link/asset URL works both inside the
            #    cluster and from a browser outside it, instead of
            #    defaulting to the internal Service hostname.
            #  - the OIDC plugin settings are pinned so WordPress can ONLY
            #    ever authenticate against this single OIDC client/realm.
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                {{- if .Values.externalUrl }}
                define('WP_HOME', '{{ .Values.externalUrl }}');
                define('WP_SITEURL', '{{ .Values.externalUrl }}');
                {{- end }}
                {{- if .Values.oidc.enabled }}
                {{/*
                  The daggerhart-openid-connect-generic plugin only reads
                  a specific set of constant names (see its
                  $environment_settings map in
                  openid-connect-generic-option-settings.php) -- it does
                  NOT recognize OPENID_CONNECT_GENERIC_* names. Using the
                  wrong names silently no-ops (the plugin falls back to
                  its empty/default settings, producing a login button
                  with blank client_id/scope instead of an error).
                */}}
                define('OIDC_CLIENT_ID', '{{ .Values.oidc.clientId }}');
                define('OIDC_CLIENT_SECRET', getenv('OIDC_CLIENT_SECRET'));
                define('OIDC_CLIENT_SCOPE', '{{ .Values.oidc.scope }}');
                define('OIDC_ENDPOINT_LOGIN_URL', '{{ .Values.oidc.loginUrl }}');
                define('OIDC_ENDPOINT_USERINFO_URL', '{{ .Values.oidc.userinfoUrl }}');
                define('OIDC_ENDPOINT_TOKEN_URL', '{{ .Values.oidc.tokenUrl }}');
                {{/* The plugin derives its expected issuer by stripping
                     everything but scheme+host+port off endpoint_login,
                     which breaks for Keycloak (issuer is scheme+host+port
                     *plus* the /realms/<realm> path). Set it explicitly
                     to the real external issuer so ID-token validation
                     (invalid-iss) doesn't false-positive. */}}
                {{- if .Values.oidc.issuer }}
                define('OIDC_ISSUER', '{{ .Values.oidc.issuer }}');
                {{- end }}
                {{- if .Values.oidc.logoutUrl }}
                define('OIDC_ENDPOINT_LOGOUT_URL', '{{ .Values.oidc.logoutUrl }}');
                {{- end }}
                define('OIDC_LOGIN_TYPE', 'button');
                {{/* Auto-provision a WP account for any user who can
                     authenticate against the "setup" Keycloak realm --
                     that realm membership is the only authentication
                     gate for this demo. */}}
                define('OIDC_CREATE_IF_DOES_NOT_EXIST', true);
                define('OIDC_LINK_EXISTING_USERS', true);
                {{- end }}
            {{- end }}
          volumeMounts:
            - name: wp-data
              mountPath: /var/www/html
            {{- if and $urlPath (ne $urlPath "/") }}
            - name: apache-subpath
              mountPath: /etc/apache2/conf-enabled/zz-subpath.conf
              subPath: subpath.conf
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: wp-data
          persistentVolumeClaim:
            claimName: {{ include "wordpress.fullname" . }}
        {{- if and $urlPath (ne $urlPath "/") }}
        - name: apache-subpath
          configMap:
            name: {{ include "wordpress.fullname" . }}-apache-subpath
        {{- end }}
